<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌸 JLPT N5 Master - Minna no Nihongo</title>
    <link rel="preload" href="NotoSansJP-Regular.otf" as="fetch" crossorigin>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #12100E;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas, #ComposeTarget {
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script src="skiko.js"></script>
    <script src="webApp.js"></script>
    <script>
        // Touch-to-Wheel Adapter for iOS WebKit (Safari, Cốc Cốc iOS, Chrome iOS) & Mobile Browsers
        // Attached to `window` and dynamically queries `#ComposeTarget` because ComposeWindow
        // clones and replaces the <canvas> node in the DOM on every window resize event.
        (function() {
            var touchStartX = 0;
            var touchStartY = 0;
            var lastTouchX = 0;
            var lastTouchY = 0;
            var lastTouchTime = 0;
            var velocityY = 0;
            var velocityX = 0;
            var isMoved = false;
            var hadTouchMove = false;
            var activeTouchId = null;
            var justStoppedMomentum = false;
            var momentumAnimId = null;
            var SLOP = 6; // movement threshold (px) to distinguish tap from scroll

            function getActiveCanvas() {
                return document.getElementById('ComposeTarget') || document.querySelector('canvas');
            }

            function stopMomentum() {
                if (momentumAnimId !== null) {
                    cancelAnimationFrame(momentumAnimId);
                    momentumAnimId = null;
                    return true;
                }
                return false;
            }

            function dispatchMouse(type, clientX, clientY) {
                var canvas = getActiveCanvas();
                if (!canvas) return;
                var rect = canvas.getBoundingClientRect();
                var offsetX = clientX - rect.left;
                var offsetY = clientY - rect.top;
                var mouseEv = new MouseEvent(type, {
                    clientX: clientX,
                    clientY: clientY,
                    screenX: clientX,
                    screenY: clientY,
                    button: 0,
                    buttons: type === 'mouseup' ? 0 : 1,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                try {
                    Object.defineProperty(mouseEv, 'offsetX', { get: function() { return offsetX; }, configurable: true });
                    Object.defineProperty(mouseEv, 'offsetY', { get: function() { return offsetY; }, configurable: true });
                } catch (_) {}
                canvas.dispatchEvent(mouseEv);
            }

            function dispatchWheel(clientX, clientY, deltaX, deltaY) {
                var canvas = getActiveCanvas();
                if (!canvas) return;

                var rect = canvas.getBoundingClientRect();
                var offsetX = clientX - rect.left;
                var offsetY = clientY - rect.top;

                var wheelEv = new WheelEvent('wheel', {
                    clientX: clientX,
                    clientY: clientY,
                    screenX: clientX,
                    screenY: clientY,
                    deltaX: deltaX,
                    deltaY: deltaY,
                    deltaMode: 0,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                try {
                    Object.defineProperty(wheelEv, 'offsetX', { get: function() { return offsetX; }, configurable: true });
                    Object.defineProperty(wheelEv, 'offsetY', { get: function() { return offsetY; }, configurable: true });
                } catch (_) {}
                canvas.dispatchEvent(wheelEv);
            }

            window.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                justStoppedMomentum = stopMomentum();

                var touch = e.touches[0];
                activeTouchId = touch.identifier;
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastTouchTime = performance.now();
                velocityY = 0;
                velocityX = 0;
                isMoved = false;
                hadTouchMove = false;
            }, { passive: false, capture: true });

            window.addEventListener('touchmove', function(e) {
                if (e.touches.length !== 1) return;
                hadTouchMove = true;
                var touch = e.touches[0];
                var now = performance.now();
                var dt = Math.max(1, now - lastTouchTime);

                var totalDistX = Math.abs(touch.clientX - touchStartX);
                var totalDistY = Math.abs(touch.clientY - touchStartY);

                // Always prevent default on touchmove in iOS WKWebView (Cốc Cốc / Chrome / Safari)
                // so native pull-to-refresh / rubber-banding does not hijack the touch stream
                if (e.cancelable) {
                    e.preventDefault();
                }

                if (!isMoved && (totalDistX > SLOP || totalDistY > SLOP)) {
                    isMoved = true;
                }

                if (isMoved) {
                    var deltaX = lastTouchX - touch.clientX;
                    var deltaY = lastTouchY - touch.clientY;

                    // Smooth velocity calculation (EMA filter)
                    var instVy = deltaY / dt;
                    velocityY = velocityY * 0.35 + instVy * 0.65;
                    var instVx = deltaX / dt;
                    velocityX = velocityX * 0.35 + instVx * 0.65;

                    dispatchWheel(touch.clientX, touch.clientY, deltaX, deltaY);
                }

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastTouchTime = now;
            }, { passive: false, capture: true });

            window.addEventListener('touchend', function(e) {
                // If this tap was only to stop an ongoing fast scroll, suppress click activation
                if (justStoppedMomentum && !isMoved) {
                    if (e.cancelable) e.preventDefault();
                    justStoppedMomentum = false;
                    hadTouchMove = false;
                    return;
                }

                // If finger slightly jittered (< SLOP) so touchmove called preventDefault(),
                // synthesize the tap click so iOS WKWebView doesn't swallow the tap
                if (!isMoved && hadTouchMove && e.changedTouches.length > 0) {
                    if (e.cancelable) e.preventDefault();
                    var tapTouch = e.changedTouches[0];
                    dispatchMouse('mousemove', tapTouch.clientX, tapTouch.clientY);
                    dispatchMouse('mousedown', tapTouch.clientX, tapTouch.clientY);
                    dispatchMouse('mouseup', tapTouch.clientX, tapTouch.clientY);
                    hadTouchMove = false;
                    activeTouchId = null;
                    return;
                }

                if (isMoved && e.changedTouches.length > 0) {
                    // Suppress synthetic mouse click at the end of a scroll drag
                    if (e.cancelable) e.preventDefault();

                    var touch = e.changedTouches[0];
                    var endX = touch.clientX;
                    var endY = touch.clientY;

                    // Natural iOS momentum flick deceleration
                    var currentVy = velocityY * 16.0;
                    var currentVx = velocityX * 16.0;
                    currentVy = Math.max(-120, Math.min(120, currentVy));
                    currentVx = Math.max(-120, Math.min(120, currentVx));

                    if (Math.abs(currentVy) > 1.0 || Math.abs(currentVx) > 1.0) {
                        function momentumStep() {
                            if (Math.abs(currentVy) < 0.4 && Math.abs(currentVx) < 0.4) {
                                stopMomentum();
                                return;
                            }
                            dispatchWheel(endX, endY, currentVx, currentVy);
                            currentVy *= 0.94; // standard iOS deceleration friction
                            currentVx *= 0.94;
                            momentumAnimId = requestAnimationFrame(momentumStep);
                        }
                        momentumAnimId = requestAnimationFrame(momentumStep);
                    }
                }
                isMoved = false;
                activeTouchId = null;
            }, { passive: false, capture: true });

            window.addEventListener('touchcancel', function() {
                stopMomentum();
                isMoved = false;
                activeTouchId = null;
            }, { passive: false, capture: true });
        })();
    </script>
</body>
</html>
