<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌸 JLPT N5 Master - Minna no Nihongo</title>
    <link rel="preload" href="NotoSansJP-Regular.otf" as="fetch" crossorigin>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #12100E;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas, #ComposeTarget {
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script src="skiko.js"></script>
    <script src="webApp.js"></script>
    <script>
        // Touch-to-Wheel Adapter for iOS WebKit (Safari, Cốc Cốc iOS, Chrome iOS) & Mobile Browsers
        // - Attached to `window` + dynamic `#ComposeTarget` lookup to survive ComposeWindow resize canvas cloning
        // - Scales scroll deltas by `window.devicePixelRatio` for true 1:1 finger tracking on Retina (2x/3x) screens
        // - Uses a 90ms sliding-window velocity tracker & frame-time (dt) independent iOS UIScrollView decay
        (function() {
            var touchStartX = 0;
            var touchStartY = 0;
            var lastTouchX = 0;
            var lastTouchY = 0;
            var lastMoveTime = 0;
            var isMoved = false;
            var hadTouchMove = false;
            var justStoppedMomentum = false;
            var momentumAnimId = null;
            var samples = []; // { x, y, t } ring buffer for jitter-free velocity tracking
            var SLOP = 5;     // movement threshold (CSS px) to distinguish tap from scroll

            function getActiveCanvas() {
                return document.getElementById('ComposeTarget') || document.querySelector('canvas');
            }

            function stopMomentum() {
                if (momentumAnimId !== null) {
                    cancelAnimationFrame(momentumAnimId);
                    momentumAnimId = null;
                    return true;
                }
                return false;
            }

            function recordSample(x, y, t) {
                samples.push({ x: x, y: y, t: t });
                // Keep only samples within the last 90ms
                var cutoff = t - 90;
                while (samples.length > 2 && samples[0].t < cutoff) {
                    samples.shift();
                }
            }

            function dispatchMouse(type, clientX, clientY) {
                var canvas = getActiveCanvas();
                if (!canvas) return;
                var rect = canvas.getBoundingClientRect();
                var offsetX = clientX - rect.left;
                var offsetY = clientY - rect.top;
                var mouseEv = new MouseEvent(type, {
                    clientX: clientX,
                    clientY: clientY,
                    screenX: clientX,
                    screenY: clientY,
                    button: 0,
                    buttons: type === 'mouseup' ? 0 : 1,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                try {
                    Object.defineProperty(mouseEv, 'offsetX', { get: function() { return offsetX; }, configurable: true });
                    Object.defineProperty(mouseEv, 'offsetY', { get: function() { return offsetY; }, configurable: true });
                } catch (_) {}
                canvas.dispatchEvent(mouseEv);
            }

            function dispatchWheel(clientX, clientY, deltaX, deltaY) {
                var canvas = getActiveCanvas();
                if (!canvas) return;

                var dpr = window.devicePixelRatio || 1;
                var rect = canvas.getBoundingClientRect();
                var offsetX = clientX - rect.left;
                var offsetY = clientY - rect.top;

                // Multiply delta by devicePixelRatio because Compose Web's SkiaLayer scales
                // canvas coordinates by devicePixelRatio but leaves WheelEvent delta unscaled.
                var wheelEv = new WheelEvent('wheel', {
                    clientX: clientX,
                    clientY: clientY,
                    screenX: clientX,
                    screenY: clientY,
                    deltaX: deltaX * dpr,
                    deltaY: deltaY * dpr,
                    deltaMode: 0,
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                try {
                    Object.defineProperty(wheelEv, 'offsetX', { get: function() { return offsetX; }, configurable: true });
                    Object.defineProperty(wheelEv, 'offsetY', { get: function() { return offsetY; }, configurable: true });
                } catch (_) {}
                canvas.dispatchEvent(wheelEv);
            }

            window.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                justStoppedMomentum = stopMomentum();

                var touch = e.touches[0];
                var now = performance.now();
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastMoveTime = now;
                isMoved = false;
                hadTouchMove = false;
                samples.length = 0;
                recordSample(touch.clientX, touch.clientY, now);
            }, { passive: false, capture: true });

            window.addEventListener('touchmove', function(e) {
                if (e.touches.length !== 1) return;
                hadTouchMove = true;
                var touch = e.touches[0];
                var now = performance.now();

                // Always prevent default on touchmove in iOS WKWebView (Cốc Cốc / Chrome / Safari)
                // so native pull-to-refresh / rubber-banding does not hijack the touch stream
                if (e.cancelable) {
                    e.preventDefault();
                }

                var totalDistX = Math.abs(touch.clientX - touchStartX);
                var totalDistY = Math.abs(touch.clientY - touchStartY);

                if (!isMoved && (totalDistX > SLOP || totalDistY > SLOP)) {
                    isMoved = true;
                    // Reset anchor to current position to avoid an initial jump when crossing SLOP
                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }

                if (isMoved) {
                    var deltaX = lastTouchX - touch.clientX;
                    var deltaY = lastTouchY - touch.clientY;
                    if (deltaX !== 0 || deltaY !== 0) {
                        dispatchWheel(touch.clientX, touch.clientY, deltaX, deltaY);
                    }
                    recordSample(touch.clientX, touch.clientY, now);
                }

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastMoveTime = now;
            }, { passive: false, capture: true });

            window.addEventListener('touchend', function(e) {
                // If this tap was only to stop an ongoing fast scroll, suppress click activation
                if (justStoppedMomentum && !isMoved) {
                    if (e.cancelable) e.preventDefault();
                    justStoppedMomentum = false;
                    hadTouchMove = false;
                    return;
                }

                // If finger slightly jittered (< SLOP) so touchmove called preventDefault(),
                // synthesize the tap click so iOS WKWebView doesn't swallow the tap
                if (!isMoved && hadTouchMove && e.changedTouches.length > 0) {
                    if (e.cancelable) e.preventDefault();
                    var tapTouch = e.changedTouches[0];
                    dispatchMouse('mousemove', tapTouch.clientX, tapTouch.clientY);
                    dispatchMouse('mousedown', tapTouch.clientX, tapTouch.clientY);
                    dispatchMouse('mouseup', tapTouch.clientX, tapTouch.clientY);
                    hadTouchMove = false;
                    return;
                }

                if (isMoved && e.changedTouches.length > 0) {
                    // Suppress synthetic mouse click at the end of a scroll drag
                    if (e.cancelable) e.preventDefault();

                    var now = performance.now();
                    var touch = e.changedTouches[0];
                    var endX = touch.clientX;
                    var endY = touch.clientY;
                    recordSample(endX, endY, now);

                    // Only fling if the finger was still moving within the last 70ms before release
                    if (now - lastMoveTime <= 70 && samples.length >= 2) {
                        var first = samples[0];
                        var last = samples[samples.length - 1];
                        var dt = last.t - first.t;

                        if (dt >= 8) {
                            // Velocity in CSS px per millisecond
                            var vx = (first.x - last.x) / dt;
                            var vy = (first.y - last.y) / dt;

                            // Clamp max flick velocity (~4.5 CSS px/ms = 4500 px/s)
                            var maxV = 4.5;
                            vx = Math.max(-maxV, Math.min(maxV, vx));
                            vy = Math.max(-maxV, Math.min(maxV, vy));

                            // Lock to dominant axis if mostly vertical or horizontal
                            if (Math.abs(vy) > Math.abs(vx) * 1.5) {
                                vx = 0;
                            } else if (Math.abs(vx) > Math.abs(vy) * 1.5) {
                                vy = 0;
                            }

                            if (Math.abs(vy) > 0.08 || Math.abs(vx) > 0.08) {
                                var lastFrameTime = now;
                                function momentumStep(frameTime) {
                                    var frameDt = Math.min(34, Math.max(1, frameTime - lastFrameTime));
                                    lastFrameTime = frameTime;

                                    // iOS UIScrollView normal deceleration rate (0.9968 per ms)
                                    var decay = Math.pow(0.9968, frameDt);
                                    vx *= decay;
                                    vy *= decay;

                                    var stepX = vx * frameDt;
                                    var stepY = vy * frameDt;

                                    if (Math.abs(stepY) < 0.15 && Math.abs(stepX) < 0.15) {
                                        stopMomentum();
                                        return;
                                    }

                                    dispatchWheel(endX, endY, stepX, stepY);
                                    momentumAnimId = requestAnimationFrame(momentumStep);
                                }
                                momentumAnimId = requestAnimationFrame(momentumStep);
                            }
                        }
                    }
                }
                isMoved = false;
                hadTouchMove = false;
                samples.length = 0;
            }, { passive: false, capture: true });

            window.addEventListener('touchcancel', function() {
                stopMomentum();
                isMoved = false;
                hadTouchMove = false;
                samples.length = 0;
            }, { passive: false, capture: true });
        })();
    </script>
</body>
</html>
