<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🌸 JLPT N5 Master - Minna no Nihongo</title>
    <link rel="preload" href="NotoSansJP-Regular.otf" as="fetch" crossorigin>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            background-color: #12100E;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script src="skiko.js"></script>
    <script src="webApp.js"></script>
    <script>
        // Touch-to-Wheel Adapter for iOS WebKit & Mobile Browsers
        // Bridges mobile touch gestures to Compose Multiplatform Web's Skiko canvas scroll engine
        (function() {
            var canvas = document.getElementById('ComposeTarget');
            if (!canvas) return;

            var touchStartX = 0;
            var touchStartY = 0;
            var lastTouchX = 0;
            var lastTouchY = 0;
            var lastTouchTime = 0;
            var velocityY = 0;
            var velocityX = 0;
            var isMoved = false;
            var justStoppedMomentum = false;
            var momentumAnimId = null;
            var SLOP = 8; // movement threshold to distinguish tap from scroll

            function stopMomentum() {
                if (momentumAnimId !== null) {
                    cancelAnimationFrame(momentumAnimId);
                    momentumAnimId = null;
                    return true;
                }
                return false;
            }

            function dispatchWheel(touch, deltaX, deltaY) {
                var rect = canvas.getBoundingClientRect();
                var clientX = touch.clientX;
                var clientY = touch.clientY;
                var offsetX = clientX - rect.left;
                var offsetY = clientY - rect.top;

                var wheelEv = new WheelEvent('wheel', {
                    clientX: clientX,
                    clientY: clientY,
                    deltaX: deltaX,
                    deltaY: deltaY,
                    deltaMode: 0,
                    bubbles: true,
                    cancelable: true
                });
                Object.defineProperty(wheelEv, 'offsetX', { value: offsetX, configurable: true });
                Object.defineProperty(wheelEv, 'offsetY', { value: offsetY, configurable: true });
                canvas.dispatchEvent(wheelEv);
            }

            canvas.addEventListener('touchstart', function(e) {
                if (e.touches.length !== 1) return;
                justStoppedMomentum = stopMomentum();

                var touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastTouchTime = performance.now();
                velocityY = 0;
                velocityX = 0;
                isMoved = false;
            }, { passive: false });

            canvas.addEventListener('touchmove', function(e) {
                if (e.touches.length !== 1) return;
                var touch = e.touches[0];
                var now = performance.now();
                var dt = Math.max(1, now - lastTouchTime);

                var totalDistX = Math.abs(touch.clientX - touchStartX);
                var totalDistY = Math.abs(touch.clientY - touchStartY);

                if (!isMoved && (totalDistX > SLOP || totalDistY > SLOP)) {
                    isMoved = true;
                }

                if (isMoved) {
                    // Prevent iOS Safari bounce / rubberband / pull down refresh
                    e.preventDefault();

                    var deltaX = lastTouchX - touch.clientX;
                    var deltaY = lastTouchY - touch.clientY;

                    // Smooth velocity calculation (EMA filter)
                    var instVy = deltaY / dt;
                    velocityY = velocityY * 0.35 + instVy * 0.65;
                    var instVx = deltaX / dt;
                    velocityX = velocityX * 0.35 + instVx * 0.65;

                    dispatchWheel(touch, deltaX, deltaY);
                }

                lastTouchX = touch.clientX;
                lastTouchY = touch.clientY;
                lastTouchTime = now;
            }, { passive: false });

            canvas.addEventListener('touchend', function(e) {
                // If this tap was only to stop an ongoing fast scroll, suppress click activation
                if (justStoppedMomentum && !isMoved) {
                    e.preventDefault();
                    justStoppedMomentum = false;
                    return;
                }

                if (isMoved && e.changedTouches.length > 0) {
                    var touch = e.changedTouches[0];
                    // Natural iOS momentum flick deceleration
                    var currentVy = velocityY * 16.0;
                    currentVy = Math.max(-100, Math.min(100, currentVy));

                    if (Math.abs(currentVy) > 1.2) {
                        function momentumStep() {
                            if (Math.abs(currentVy) < 0.4) {
                                stopMomentum();
                                return;
                            }
                            dispatchWheel(touch, 0, currentVy);
                            currentVy *= 0.94; // standard iOS deceleration friction
                            momentumAnimId = requestAnimationFrame(momentumStep);
                        }
                        momentumAnimId = requestAnimationFrame(momentumStep);
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchcancel', function(e) {
                stopMomentum();
                isMoved = false;
            }, { passive: false });
        })();
    </script>
</body>
</html>
